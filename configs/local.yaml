# Layer 1 — this machine (from local.yaml.example). User whitelist only.
# See xr_hand_retarget/docs/dev/CONFIG.md and docs/user/SMOOTHNESS.md.

hands:
  source: xrt
  type: xhand1

teleop:
  publish_hz: 120
  retarget_hz: 80
  max_iterations: 10   # 可选；压 vector L-BFGS。FA_HAND_MAX_ITER 优先；默认 yaml=40
  # ee_source: wrist     # 文档指针：wrist|controller|hand（实际仍用 ./run.sh 参数）

command:
  publish_command: true
  max_velocity: 6.0
  filter_cutoff_hz: 12.0
  command_epsilon: 0.001
  target_timeout: 0.25
  allowed_fsm_states: [3, 4]
