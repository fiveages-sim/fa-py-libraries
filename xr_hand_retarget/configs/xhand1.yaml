# XHand1 — family index (layer 2), same pattern as o6.yaml.
# Detail: hands/xhand1.yaml + calib/xrt_default.yaml
# Recapture: python -m xr_hand_retarget.calibrate --config <this file>
# Run: FA_HAND=xhand1 ./run.sh vr-xrt wrist
# method: fixed to vector (one method per hand; local.yaml method optional)

backend: xhand1

xhand1:
  config: hands/xhand1.yaml

# Publish-path safety (teleop_ws DexCap). Override from configs/local.yaml → command:
safety:
  command:
    enabled: true
    publish_command: true
    allowed_fsm_states: [3, 4]
    max_velocity: 6.0
    filter_cutoff_hz: 8.0
    command_epsilon: 0.001
    target_timeout: 0.25
    require_resync: true
